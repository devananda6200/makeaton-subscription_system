# Hackathon demo: fictional data and public demo accounts only.
# Durable storage is provided by Turso Free; Render keeps no local database.
services:
  - type: web
    name: brightloop-subscriptions
    runtime: node
    region: singapore
    plan: free
    branch: main
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: REQUIRE_REMOTE_DATABASE
        value: "true"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DEMO_MODE
        value: "true"
